# LiteLLM Proxy Configuration for Perplexity AI
# This configuration allows you to use Perplexity AI through LiteLLM proxy

model_list:
  # Perplexity AI models via custom API server
  - model_name: perplexity/auto
    litellm_params:
      model: openai/perplexity-auto
      api_base: http://localhost:8000/v1
      api_key: not-needed
  
  - model_name: perplexity/pro
    litellm_params:
      model: openai/perplexity-pro
      api_base: http://localhost:8000/v1
      api_key: not-needed
  
  - model_name: perplexity/reasoning
    litellm_params:
      model: openai/perplexity-reasoning
      api_base: http://localhost:8000/v1
      api_key: not-needed
  
  # Standard OpenAI models (requires OPENAI_API_KEY env var)
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
  
  - model_name: gpt-4
    litellm_params:
      model: gpt-4
  
  # Add more models as needed
  # - model_name: claude-3-sonnet
  #   litellm_params:
  #     model: claude-3-sonnet-20240229
  #     api_key: os.environ/ANTHROPIC_API_KEY

# General settings
general_settings:
  master_key: sk-1234  # Change this to a secure key
  database_url: null
  
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  
# Router settings for load balancing (optional)
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
